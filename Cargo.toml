[package]
name = "NetRTS-Flaud-"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13.5", features = ["json"] }
wiremock = "0.6"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
dotenvy = "0.15.7"
serde_json = "1.0.154"
crossterm = "0.29"

[dev-dependencies]
schemars = "1"
